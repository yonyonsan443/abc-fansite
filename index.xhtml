<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC
  "-//W3C//DTD XHTML 1.1//EN"
  "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xml:lang="ja">
<head>
  <title>ABCさんのホームページ（非公式）</title>
  <style type="text/css">
    body {
      margin: 8px;
      font-family: serif;
    }

    #container {
      display: flex;
      min-height: 75vh;
    }

    #sidepanel {
      width: 20%;
    }

    #main {
      width: 80%;
    }

    object {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    #footer {
      height: 60px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="sidepanel">
      <object data="sidepanel.xhtml"
              type="application/xhtml+xml">
        <p>メニューを表示できません。</p>
      </object>
    </div>

    <div id="main">
      <object data="main.xhtml"
              type="application/xhtml+xml">
        <p>本文を表示できません。</p>
      </object>
    </div>
  </div>

  <div id="footer">
    <object data="copyright.xhtml"
            type="application/xhtml+xml">
      <p>フッターを表示できません。</p>
    </object>
  </div>
</body>
</html>
